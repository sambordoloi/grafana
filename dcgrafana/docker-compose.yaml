services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    # AWS SDK credential chain for EC2 service discovery. role_arn stays in prometheus.yml.
    env_file:
      - .env
    ports:
      - 9090:9090
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - prom_data:/prometheus
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=grafana
    volumes:
      - ./grafana:/etc/grafana/provisioning/datasources
      - ./grafana/data:/var/lib/grafana
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alertmanager
    # SLACK_CHANNEL and SLACK_WEBHOOK_URL are substituted at startup.
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/etc/alertmanager/render-config.sh"]
    command: ["--storage.path=/alertmanager"]
    ports:
      - 9093:9093
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
      - ./alertmanager/render-config.sh:/etc/alertmanager/render-config.sh:ro
volumes:
  prom_data:
