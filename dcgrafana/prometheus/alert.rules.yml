groups:
- name: alert_rules
  rules:
  # CPU warning: above 75% and below 85%. environment comes from the scrape target.
  - alert: CpuUsageWarning
    expr: |
      (
        100 - (avg by (instance, environment) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 75
      )
      and
      (
        100 - (avg by (instance, environment) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) < 85
      )
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: 'CPU {{ printf "%.0f" $value }}% on {{ $labels.instance }} ({{ $labels.environment }})'
      description: "CPU usage is above 75% and below 85% for more than 2 minutes."

  # CPU critical: above 85%
  - alert: CpuUsageCritical
    expr: 100 - (avg by (instance, environment) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: 'CPU {{ printf "%.0f" $value }}% on {{ $labels.instance }} ({{ $labels.environment }})'
      description: "CPU usage is above 85% for more than 2 minutes."

  # Memory warning: above 75% and below 85%
  - alert: MemoryUsageWarning
    expr: |
      (
        (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 75
      )
      and
      (
        (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 < 85
      )
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: 'Memory {{ printf "%.0f" $value }}% on {{ $labels.instance }} ({{ $labels.environment }})'
      description: "Memory usage is above 75% and below 85% for more than 2 minutes."

  # Memory critical: above 85%
  - alert: MemoryUsageCritical
    expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: 'Memory {{ printf "%.0f" $value }}% on {{ $labels.instance }} ({{ $labels.environment }})'
      description: "Memory usage is above 85% for more than 2 minutes."

  # Disk warning: above 75% and below 85%
  - alert: DiskUsageWarning
    expr: |
      (
        (node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint!="/run"}) / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} * 100 > 75
      )
      and
      (
        (node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint!="/run"}) / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} * 100 < 85
      )
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: 'Disk {{ printf "%.0f" $value }}% on {{ $labels.instance }} {{ $labels.mountpoint }} ({{ $labels.environment }})'
      description: "Disk usage is above 75% and below 85% for more than 2 minutes."

  # Disk critical: above 85%
  - alert: DiskUsageCritical
    expr: (node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint!="/run"}) / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} * 100 > 85
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: 'Disk {{ printf "%.0f" $value }}% on {{ $labels.instance }} {{ $labels.mountpoint }} ({{ $labels.environment }})'
      description: "Disk usage is above 85% for more than 2 minutes."

  - alert: StoppedContainers
    expr: engine_daemon_container_states_containers{state="exited"} > 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: 'Container down on {{ $labels.instance }} ({{ $labels.environment }})'
      description: "One or more containers have been in the exited state for more than 2 minutes."
