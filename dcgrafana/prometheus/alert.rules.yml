groups:
- name: alert_rules
  rules:
  # CPU warning for low env: above 75% and below 85%
  - alert: CpuUsageWarning
    expr: ((100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100)) > 75) and ((100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100)) < 85)
    for: 2m
    labels:
      severity: warning
      environment: lower
    annotations:
      summary: "CPU usage above 75% on instance {{ $labels.instance }}"
      description: "CPU usage is above 75% and below 85% for more than 2 minutes. Current value: {{ $value }}%"

  # CPU critical for low env: above 85%
  - alert: CpuUsageCritical
    expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
    for: 2m
    labels:
      severity: critical
      environment: lower
    annotations:
      summary: "CPU usage above 85% on instance {{ $labels.instance }}"
      description: "CPU usage is above 85% for more than 2 minutes. Current value: {{ $value }}%"

  # CPU warning for production: above 75% and below 85%
  - alert: CpuUsageWarning
    expr: ((100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100)) > 75) and ((100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100)) < 85)
    for: 2m
    labels:
      severity: warning
      environment: production
    annotations:
      summary: "CPU usage above 75% on instance {{ $labels.instance }}"
      description: "CPU usage is above 75% and below 85% for more than 2 minutes. Current value: {{ $value }}%"

  # CPU critical for production: above 85%
  - alert: CpuUsageCritical
    expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
    for: 2m
    labels:
      severity: critical
      environment: production
    annotations:
      summary: "CPU usage above 85% on instance {{ $labels.instance }}"
      description: "CPU usage is above 85% for more than 2 minutes. Current value: {{ $value }}%"

  # Memory warning for low env: above 75% and below 85%
  - alert: MemoryUsageWarning
    expr: (((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 75) and ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 < 85))
    for: 2m
    labels:
      severity: warning
      environment: lower
    annotations:
      summary: "Memory usage above 75% on instance {{ $labels.instance }}"
      description: "Memory usage is above 75% and below 85% for more than 2 minutes. Current value: {{ $value }}%"

  # Memory critical for low env: above 85%
  - alert: MemoryUsageCritical
    expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
    for: 2m
    labels:
      severity: critical
      environment: lower
    annotations:
      summary: "Memory usage above 85% on instance {{ $labels.instance }}"
      description: "Memory usage is above 85% for more than 2 minutes. Current value: {{ $value }}%"

  # Memory warning for production: above 75% and below 85%
  - alert: MemoryUsageWarning
    expr: (((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 75) and ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 < 85))
    for: 2m
    labels:
      severity: warning
      environment: production
    annotations:
      summary: "Memory usage above 75% on instance {{ $labels.instance }}"
      description: "Memory usage is above 75% and below 85% for more than 2 minutes. Current value: {{ $value }}%"

  # Memory critical for production: above 85%
  - alert: MemoryUsageCritical
    expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
    for: 2m
    labels:
      severity: critical
      environment: production
    annotations:
      summary: "Memory usage above 85% on instance {{ $labels.instance }}"
      description: "Memory usage is above 85% for more than 2 minutes. Current value: {{ $value }}%"
        
  # Disk warning for low env: above 75% and below 85%
  - alert: DiskUsageWarning
    expr: ((node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint!="/run"}) / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} * 100 > 75) and ((node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint!="/run"}) / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} * 100 < 85)
    for: 2m
    labels:
      severity: warning
      environment: lower
    annotations:
      summary: "Disk usage above 75% on instance {{ $labels.instance }}"
      description: "Disk usage is above 75% and below 85% for more than 2 minutes. Current value: {{ $value }}%"

  # Disk critical for low env: above 85%
  - alert: DiskUsageCritical
    expr: (node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint!="/run"}) / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} * 100 > 85
    for: 2m
    labels:
      severity: critical
      environment: lower
    annotations:
      summary: "Disk usage above 85% on instance {{ $labels.instance }}"
      description: "Disk usage is above 85% for more than 2 minutes. Current value: {{ $value }}%"

  # Disk warning for production: above 75% and below 85%
  - alert: DiskUsageWarning
    expr: ((node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint!="/run"}) / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} * 100 > 75) and ((node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint!="/run"}) / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} * 100 < 85)
    for: 2m
    labels:
      severity: warning
      environment: production
    annotations:
      summary: "Disk usage above 75% on instance {{ $labels.instance }}"
      description: "Disk usage is above 75% and below 85% for more than 2 minutes. Current value: {{ $value }}%"

  # Disk critical for production: above 85%
  - alert: DiskUsageCritical
    expr: (node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint!="/run"}) / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint!="/run"} * 100 > 85
    for: 2m
    labels:
      severity: critical
      environment: production
    annotations:
      summary: "Disk usage above 85% on instance {{ $labels.instance }}"
      description: "Disk usage is above 85% for more than 2 minutes. Current value: {{ $value }}%"
        
  # Alert for Stopped Containers for low env
  - alert: StoppedContainers
    expr: engine_daemon_container_states_containers{state="exited"} > 0
    for: 2m
    labels:
      severity: critical
      environment: lower
    annotations:
      summary: "Container is down on instance {{ $labels.instance }}"
      description: "One or more containers have been in the exited state for more than 2 minutes."

  # Alert for Stopped Containers for prod env
  - alert: StoppedContainers
    expr: engine_daemon_container_states_containers{state="exited"} > 0
    for: 2m
    labels:
      severity: critical
      environment: production
    annotations:
      summary: "Container is down on instance {{ $labels.instance }}"
      description: "One or more containers have been in the exited state for more than 2 minutes."
        
