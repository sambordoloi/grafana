# Not used as-is. render-config.sh builds the live config from dcgrafana/.env,
# including SHIFT_* windows, when the container starts.
global:
  resolve_timeout: 5m

route:
  receiver: notify
  group_by: ['alertname', 'environment', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - match:
        severity: critical
      receiver: notify
      repeat_interval: 10m
    - match:
        severity: warning
      receiver: notify
      repeat_interval: 12h

receivers:
  - name: notify
    slack_configs:
      - channel: '${SLACK_CHANNEL}'
        api_url: '${SLACK_WEBHOOK_URL}'
        send_resolved: true
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        send_resolved: true
        severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}warning{{ end }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          environment: '{{ .CommonLabels.environment }}'
          instance: '{{ .CommonLabels.instance }}'
          description: '{{ .CommonAnnotations.description }}'
