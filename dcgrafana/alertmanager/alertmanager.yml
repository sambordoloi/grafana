global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: ['alertname', 'environment', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - match:
        severity: critical
      receiver: slack
      repeat_interval: 10m
    - match:
        severity: warning
      receiver: slack
      repeat_interval: 12h

receivers:
  - name: slack
    slack_configs:
      - channel: '${SLACK_CHANNEL}'
        api_url: '${SLACK_WEBHOOK_URL}'
        send_resolved: true
